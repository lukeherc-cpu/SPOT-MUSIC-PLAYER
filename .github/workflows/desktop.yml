name: Spot Music desktop builds
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
      - 'docs/licenses/**'
      - 'LICENSE'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: spot-desktop-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        name: Create the desktop alpha release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="desktop-alpha-${GITHUB_RUN_NUMBER}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Spot Music desktop alpha ${GITHUB_RUN_NUMBER}" \
            --notes-file desktop/RELEASE_NOTES.md
  desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            target: win
            arch: x64
          - os: ubuntu-latest
            platform: linux
            target: linux
            arch: x64
          - os: macos-15-intel
            platform: mac
            target: mac
            arch: x64
          - os: macos-15
            platform: mac
            target: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install pinned dependencies and Electron
        run: |
          npm ci --no-audit --no-fund
          npx --no install-electron --no
      - name: Bundle verified audio resolver and application icon
        run: npm run prepare:resolver
      - name: Unit checks
        run: npm test
      - name: Desktop navigation and local audio playback
        if: runner.os != 'Linux'
        run: npm run test:ui
      - name: Linux navigation and local audio playback
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:ui
      - name: Build native installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm version "0.2.0-alpha.${GITHUB_RUN_NUMBER}" --no-git-tag-version
          npm run dist -- --${{ matrix.target }} --${{ matrix.arch }}
          node scripts/check-package.mjs
      - name: Verify the packaged desktop application
        if: runner.os != 'Linux'
        run: node scripts/package-smoke.mjs
      - name: Verify the packaged Linux application
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/package-smoke.mjs
      - name: Publish installers, checksums and UI previews
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: node scripts/publish.mjs
