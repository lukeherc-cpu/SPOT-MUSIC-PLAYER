name: Android checks
on:
  push:
    branches: [main]
    paths-ignore:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  pull_request:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew --no-daemon :app:assembleDebug testDebugUnitTest --console=plain -Pgamut.abis=x86_64
