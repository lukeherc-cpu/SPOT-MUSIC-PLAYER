name: Verify replacement UI previews
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui-preview.yml'
      - 'app/src/androidTest/kotlin/com/gamut/NavigationSmokeTest.kt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  previews:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check replacement screens and export PNG previews
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -camera-back none
          script: |
            bash ./gradlew --no-daemon :app:connectedDebugAndroidTest --console=plain || (adb logcat -d -s TestRunner AndroidRuntime; exit 1)
            adb exec-out cat /sdcard/spot-ui-home.png > ui-home.png
            adb exec-out cat /sdcard/spot-ui-search.png > ui-search.png
            adb exec-out cat /sdcard/spot-ui-library.png > ui-library.png
            adb exec-out cat /sdcard/spot-ui-playlist.png > ui-playlist.png
            adb exec-out cat /sdcard/spot-ui-player.png > ui-player.png
            adb exec-out cat /sdcard/spot-ui-podcasts.png > ui-podcasts.png
            adb exec-out cat /sdcard/spot-ui-import.png > ui-import.png
            python3 -c "from pathlib import Path; files=list(Path('.').glob('ui-*.png')); assert len(files)==7; assert all(p.read_bytes().startswith(bytes.fromhex('89504e470d0a1a0a')) and p.stat().st_size > 1000 for p in files)"
      - name: Replace invalid preview exports on the verified alpha release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload spot-alpha-5 ui-home.png ui-search.png ui-library.png ui-playlist.png ui-player.png ui-podcasts.png ui-import.png --clobber --repo "$GITHUB_REPOSITORY"
